name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS-AppleSilicon
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: macOS-Intel
          - platform: windows-latest
            args: ""
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm/action-setup v4 从 package.json 的 packageManager 字段自动读版本
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && (matrix.label == 'macOS-Intel' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || 'x86_64-pc-windows-msvc' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller

      # 用 PyInstaller 把 Python 引擎 + numpy 打成单文件二进制（安装即用）
      - name: Build engine binary
        run: pyinstaller engine.spec --noconfirm --clean

      - name: Move engine binary to src-tauri/binaries
        run: |
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/visionlog-engine.exe src-tauri/binaries/visionlog-engine.exe
          else
            cp dist/visionlog-engine src-tauri/binaries/visionlog-engine
            chmod +x src-tauri/binaries/visionlog-engine
          fi
          ls -lh src-tauri/binaries/

      # Tauri 官方 action：自动处理打包、资源嵌入、release 创建
      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "visionlog ${{ github.ref_name }}"
          releaseBody: |
            ## 下载

            - **macOS-AppleSilicon**: `.dmg` (M1/M2/M3/M4)
            - **macOS-Intel**: `.dmg`
            - **Windows**: `.exe` (x64)

            ## 安装

            1. 下载对应平台的安装包
            2. macOS: 打开 `.dmg`，拖入 Applications
            3. Windows: 运行 `.exe` 安装程序

            ## 使用

            启动后自动加载 VisionLOG 配置，选择目标相机机型，点击「生成移植 DCP」即可。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
